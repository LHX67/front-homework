<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级水平导航菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            /* 增加页面背景，解决空白单调问题 */
            background-color: #f5f7fa;
        }
        /* 清除a标签默认下划线 */
        a {
            text-decoration: none;
            color: #fff;
        }
        table {
            background-color: #2c3e50;
            width: 100%;  /* 导航铺满整个页面宽度 */
            border-collapse: collapse; /* 合并单元格边框 */
        }
        td {
            text-align: center;
        }
        td a {
            /* 盒模型：padding扩大点击区域 */
            display: block;
            padding: 14px 22px;
            font-size: 16px;
        }
        /* 鼠标悬停伪类 */
        td a:hover {
            background-color: #3498db;
        }
        /* 页面标题区域，放在导航上方 */
        .header-title{
            background-color:#1f2937;
            color:white;
            padding:12px;
            font-size:20px;
            text-align:center;
        }
    </style>
</head>
<body>
    

    <table>
        <tr>           
            <td><a href="#">首页</a></td>
            <td><a href="#">教学院(部)</a></td>
            <td><a href="#">党群机构</a></td>
            <td><a href="#">行政教辅机构</a></td>
            <td><a href="#">教学科研</a></td>
            <td><a href="#">招生就业</a></td>
            <td><a href="#">国际交流</a></td>
            <td><a href="#">数字图书馆</a></td>
        </tr>
    </table>
    
</body>
</html>
